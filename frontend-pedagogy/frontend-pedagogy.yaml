id: frontend-interface-pedagogy

title: Front-end and interface-layer development pedagogy in higher education

scope_statement: >
  This field maps the pedagogy and didactics of front-end development understood as the
  human-facing interaction layer of digital systems. Web technologies remain the primary
  teaching substrate because they are open, inspectable, accessible, cross-platform, and
  professionally central; however, the field also covers transferable front-end concepts
  for application interfaces, dashboards, IoT/robotics control panels, data tools, creative
  coding environments, and 3D/immersive interfaces.


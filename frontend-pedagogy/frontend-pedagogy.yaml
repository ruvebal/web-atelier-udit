notes: >
  Twin mandate: distinguish durable FRONT-END FUNDAMENTALS from fast-moving implementation
  technologies. The field should not collapse front-end development into website production.
  Web technologies remain the privileged pedagogical substrate, but the conceptual object is
  broader: the design and implementation of human-facing interface layers for interactive
  systems, including web apps, application dashboards, data tools, IoT/robotics interfaces,
  creative coding systems, and 3D/immersive environments.

research_hypotheses:
  - >
    Platform fundamentals such as semantic structure, layout, interaction states, browser/DOM
    literacy, accessibility, version control, and API interaction have a longer curricular
    half-life than specific frameworks or build tools.
  - >
    Web technologies are pedagogically valuable not only because they produce websites, but
    because the browser is an inspectable, cross-platform laboratory for interface-layer
    thinking.
  - >
    AI-assisted coding increases the need for process-based assessment, explanation,
    debugging, and authorship verification.
  - >
    Accessibility should be treated as a front-end fundamental rather than as a late-stage
    compliance checklist.
  - >
    3D web, IoT dashboards, robotics panels, and Python-backed interfaces are useful boundary
    cases for preventing students from equating front-end development with static web artefacts.

exclusions:
  - purely back-end web development
  - general software engineering without a human-facing interface layer
  - generic UX research without implementation pedagogy
  - pure graphic design without computational interface implementation
  - AI-in-education literature not connected to programming, interfaces, assessment, or computing curricula
  - robotics or IoT education without an interface/control/visualization layer
  - 3D graphics education without browser, interface, or front-end relevance

evidence_policy:
  claim_tags:
    - ESTABLISHED
    - EMERGING
    - UNVERIFIED-GAP # legitimate frontier: absence + adjacent grounding + actionable now
    - UNVERIFIED-NOISE # reified metaphor / ungrounded synthesis: flag and discard, do not build on it
  requirements:
    - cite_real_checkable_sources
    - prefer_ACM_IEEE_W3C_peer_reviewed_or_curriculum_frameworks
    - mark_web_specific_blanks_explicitly
    - do_not_infer_from_general_programming_to_front_end_without_warning
    - distinguish_practitioner_sources_from_peer_reviewed_sources
    - distinguish_web_platform_claims_from_cross_platform_interface_claims
    - triage_every_unverified_claim_as_gap_or_noise_using_the_evidence_tags_heuristic
    # heuristic (see profield-frontend-pedagogy.md, "Evidence tags" section, for full version):
    # GAP  = specific named absence + grounded in adjacent established evidence + actionable this term
    # NOISE = smooth ungrounded synthesis, or a metaphor asserted as a formal construct

cadence_days: 120
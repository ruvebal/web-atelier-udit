name: Docs Portal — Build & Deploy (Jekyll from nested source)

on:
 push:
  branches: [main]
  paths:
   - 'web-foundations/**'
   - '_layouts/**'
   - '_includes/**'
   - 'assets/**'
   - '.github/workflows/pages.yml'
 workflow_dispatch:

permissions:
 contents: read
 pages: write
 id-token: write

concurrency:
 group: 'pages'
 cancel-in-progress: true

env:
 JEKYLL_ENV: production

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4

   - uses: ruby/setup-ruby@v1
     with:
      ruby-version: '3.2'
      bundler-cache: true

   - uses: actions/setup-node@v4
     with:
      node-version: '20'

   - uses: pnpm/action-setup@v4
     with:
      version: 9

   - name: Install Node.js deps (web-foundations)
     working-directory: web-foundations
     run: pnpm install --frozen-lockfile

   - name: Install Jekyll deps (web-foundations)
     working-directory: web-foundations
     run: |
      bundle config set path 'vendor/bundle'
      bundle install --jobs 4 --retry 3

   - name: Build site (from nested source web-foundations/docs)
     working-directory: web-foundations
     run: |
      set -o pipefail
      npm run build 2>&1 | tee "$RUNNER_TEMP/jekyll-build.log"

   # A "Liquid Warning" means Jekyll parsed {{ ... }} or {% ... %} somewhere it
   # should not have — almost always inside a fenced code block. The page still
   # builds, but the expression is SILENTLY DELETED from the published HTML, so
   # students copy-paste broken code. Real cases caught this way:
   #   JSX     <Navigate ... state={{ from: location }} />  -> published as  state=
   #   Actions --shard=${{ matrix.shard }}/3                -> published as  --shard=$/3
   # Fix by wrapping the fence in {% raw %} / {% endraw %}.
   # See .cursor/rules/lesson-publishing-integrity.mdc
   - name: Fail on Liquid warnings (silently corrupts published code blocks)
     run: |
      LOG="$RUNNER_TEMP/jekyll-build.log"
      if grep -q "Liquid Warning" "$LOG"; then
        echo "::error title=Liquid processed inside a code block::Wrap the offending fence in {% raw %} / {% endraw %}. The expression is deleted from the published HTML, so readers copy broken code."
        echo
        echo "Offending files:"
        grep "Liquid Warning" "$LOG" | sed 's/^/  /'
        exit 1
      fi
      echo "✅ No Liquid warnings — no code blocks were mangled."

   - name: Prepare artifact (flatten path)
     run: |
      rm -rf site-root
      mkdir site-root
      cp -r web-foundations/_site/* site-root/

   - name: Upload Pages artifact
     uses: actions/upload-pages-artifact@v3
     with:
      path: site-root

 deploy:
  needs: build
  runs-on: ubuntu-latest
  environment:
   name: github-pages
   url: ${{ steps.deployment.outputs.page_url }}
  steps:
   - id: deployment
     uses: actions/deploy-pages@v4

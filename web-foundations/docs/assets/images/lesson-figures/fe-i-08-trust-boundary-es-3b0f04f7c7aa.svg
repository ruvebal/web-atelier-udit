<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 324" width="680" height="324" role="img" aria-labelledby="t d">
<title id="t">Sesión 8: el renderizado es una frontera de confianza</title>
<desc id="d">La misma cadena no confiable llega a dos sumideros. Con innerHTML se interpreta como HTML, se crea un elemento img y su código onerror se ejecuta. Con textContent se guarda como texto, se muestra literal y no se ejecuta nada.</desc>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C44536" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-safe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F7D6D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A847C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="324" fill="#F7F2E8"/>
<rect x="40" y="126" width="170" height="60" rx="6" fill="#FFFDF8" stroke="#111111" stroke-width="0.75"/><text x="125" y="152" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#111111">Cadena no confiable</text><text x="125" y="170" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B5650">formulario · URL · API · IA</text>
<text x="125" y="210" text-anchor="middle" font-family="Menlo, 'SF Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#111111">&lt;img src=x onerror=…&gt;</text>
<line x1="250" y1="34" x2="250" y2="286" stroke="#111111" stroke-width="0.75" stroke-dasharray="3 4"/>
<text x="250" y="304" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111111">frontera de confianza</text>
<path d="M210 146 L262 78" fill="none" stroke="#C44536" stroke-width="1.25" marker-end="url(#a-accent)"/>
<path d="M210 166 L262 234" fill="none" stroke="#2F7D6D" stroke-width="1.25" marker-end="url(#a-safe)"/>
<rect x="266" y="52" width="172" height="52" rx="6" fill="#F6DDD8" stroke="#C44536" stroke-width="0.75"/><text x="352" y="83" text-anchor="middle" font-family="Menlo, 'SF Mono', ui-monospace, monospace" font-size="14" font-weight="500" fill="#7A2219">el.innerHTML = s</text>
<rect x="456" y="40" width="184" height="52" rx="6" fill="#F6DDD8" stroke="#C44536" stroke-width="0.75"/><text x="548" y="62" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#7A2219">Se interpreta como HTML</text><text x="548" y="80" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C44536">se crea un nodo &lt;img&gt; real</text>
<rect x="456" y="104" width="184" height="52" rx="6" fill="#F6DDD8" stroke="#C44536" stroke-width="0.75"/><text x="548" y="126" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#7A2219">onerror se ejecuta</text><text x="548" y="144" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C44536">corre código inyectado</text>

<rect x="456" y="232" width="184" height="52" rx="6" fill="#DDEFEA" stroke="#2F7D6D" stroke-width="0.75"/><text x="548" y="254" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B4D43">Se muestra literal</text><text x="548" y="272" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2F7D6D">no se ejecuta nada</text>

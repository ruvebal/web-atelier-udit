<rect x="266" y="208" width="172" height="52" rx="6" fill="#DDEFEA" stroke="#2F7D6D" stroke-width="0.75"/><text x="352" y="239" text-anchor="middle" font-family="Menlo, 'SF Mono', ui-monospace, monospace" font-size="14" font-weight="500" fill="#1B4D43">el.textContent = s</text>

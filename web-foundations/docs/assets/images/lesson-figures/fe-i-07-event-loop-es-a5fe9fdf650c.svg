<title id="t">Sesión 7: el bucle de eventos del navegador</title>
<desc id="d">Una vez, al cargar, main.js registra los listeners. Después, un bucle: el usuario actúa, se dispara un evento, se ejecuta el listener, el DOM cambia, el navegador repinta y el usuario percibe el feedback.</desc>

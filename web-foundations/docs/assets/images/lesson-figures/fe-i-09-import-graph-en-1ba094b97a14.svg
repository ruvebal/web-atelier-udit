<title id="t">Session 9: the lab import graph</title>
<desc id="d">index.html loads main.js with type module. main.js imports utils.js, projects.js and header.js; projects.js also imports utils.js, which still runs once. projects.js is the boundary: it owns the data and how it renders, so a change to card markup stays inside it.</desc>

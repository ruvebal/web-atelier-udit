<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 366" width="680" height="366" role="img" aria-labelledby="t d">
<title id="t">Session 7: the browser event loop</title>
<desc id="d">Once at load, main.js registers listeners. Then a loop: the user acts, an event fires, the listener runs, the DOM changes, the browser repaints, and the user perceives feedback.</desc>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C44536" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-safe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2F7D6D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A847C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

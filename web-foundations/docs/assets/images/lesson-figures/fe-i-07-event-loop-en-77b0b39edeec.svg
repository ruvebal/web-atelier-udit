<path d="M390 72 L436 72" fill="none" stroke="#111111" stroke-width="1.25" marker-end="url(#a-ink)"/>
<text x="40" y="140" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#111111">Every interaction</text>
<rect x="40" y="156" width="180" height="56" rx="6" fill="#FFFDF8" stroke="#111111" stroke-width="0.75"/><text x="130" y="180" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#111111">User acts</text><text x="130" y="198" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B5650">click · input · scroll</text>

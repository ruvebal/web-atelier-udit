<rect x="240" y="50" width="150" height="44" rx="6" fill="#FFFDF8" stroke="#111111" stroke-width="0.75"/><text x="315" y="77" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#111111">DOM tree</text>
<rect x="440" y="46" width="200" height="52" rx="6" fill="#FFFDF8" stroke="#111111" stroke-width="0.75" stroke-dasharray="4 3"/><text x="540" y="68" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#111111">main.js (defer)</text><text x="540" y="86" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B5650">registers listeners</text>

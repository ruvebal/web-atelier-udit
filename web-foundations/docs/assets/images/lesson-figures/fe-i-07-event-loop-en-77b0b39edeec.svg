<rect x="460" y="156" width="180" height="56" rx="6" fill="#FFFDF8" stroke="#111111" stroke-width="0.75"/><text x="550" y="180" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#111111">Listener runs</text><text x="550" y="198" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B5650">your function</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 520" role="img" aria-labelledby="sf-title sf-desc">
  <title id="sf-title">Streamfield file map</title>
  <desc id="sf-desc">Contract and handlers feed the hook. The page splits readout, SVG membrane, and optional aura.</desc>
  <rect width="680" height="520" fill="#F7F2E8"/>
  <text x="40" y="36" fill="#111111" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16" font-weight="500">Ex6 Streamfield - who owns what</text>
  <text x="40" y="56" fill="#5F5E5A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">src/streamfield/* plus pages/Ex6Streamfield.jsx</text>
  <g>
    <rect x="40" y="80" width="200" height="70" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="140" y="110" text-anchor="middle" fill="#3C3489" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="500">contract.js</text>
    <text x="140" y="130" text-anchor="middle" fill="#534AB7" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">URL + snapshot()</text>
  </g>
  <g>
    <rect x="260" y="80" width="200" height="70" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="360" y="110" text-anchor="middle" fill="#3C3489" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="500">handlers.js</text>
    <text x="360" y="130" text-anchor="middle" fill="#534AB7" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">MSW pushes frames</text>
  </g>
  <g>
    <rect x="480" y="80" width="160" height="70" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="560" y="110" text-anchor="middle" fill="#3C3489" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="500">browser.js</text>
    <text x="560" y="130" text-anchor="middle" fill="#534AB7" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">start / stop SW</text>
  </g>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="340" y1="150" x2="340" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr2)" fill="none"/>
  <g>
    <rect x="190" y="180" width="300" height="70" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
    <text x="340" y="210" text-anchor="middle" fill="#712B13" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="500">useDeviceStream.js</text>
    <text x="340" y="230" text-anchor="middle" fill="#993C1D" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">open / message / reconnect / close</text>
  </g>
  <line x1="340" y1="250" x2="340" y2="278" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr2)" fill="none"/>
  <g>
    <rect x="190" y="280" width="300" height="56" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="340" y="304" text-anchor="middle" fill="#0C447C" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="500">Ex6Streamfield.jsx</text>
    <text x="340" y="322" text-anchor="middle" fill="#185FA5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">wires source + children</text>
  </g>
  <line x1="200" y1="336" x2="120" y2="364" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr2)" fill="none"/>
  <line x1="340" y1="336" x2="340" y2="364" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr2)" fill="none"/>
  <line x1="480" y1="336" x2="560" y2="364" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr2)" fill="none"/>
  <g>
    <rect x="40" y="368" width="160" height="78" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
    <text x="120" y="398" text-anchor="middle" fill="#27500A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" font-weight="500">StreamReadout</text>
    <text x="120" y="418" text-anchor="middle" fill="#3B6D11" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">status / fields / JSON</text>
    <text x="120" y="434" text-anchor="middle" fill="#3B6D11" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">owns decisions</text>
  </g>
  <g>
    <rect x="240" y="368" width="200" height="78" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
    <text x="340" y="392" text-anchor="middle" fill="#27500A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" font-weight="500">RisField + Continuum</text>
    <text x="340" y="412" text-anchor="middle" fill="#3B6D11" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">SVG owns the reading</text>
    <text x="340" y="430" text-anchor="middle" fill="#3B6D11" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">path.js = Catmull-Rom</text>
  </g>
  <g>
    <rect x="480" y="368" width="160" height="78" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
    <text x="560" y="398" text-anchor="middle" fill="#2C2C2A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" font-weight="500">StreamAura</text>
    <text x="560" y="418" text-anchor="middle" fill="#5F5E5A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">R3F decor only</text>
    <text x="560" y="434" text-anchor="middle" fill="#5F5E5A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">optional / off by default</text>
  </g>
  <text x="40" y="490" fill="#5F5E5A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">Green = operational truth. Grey aura = atmosphere. If SVG and aura disagree, trust SVG + readout.</text>
</svg>

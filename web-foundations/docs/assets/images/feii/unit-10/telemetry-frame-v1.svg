<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 460" role="img" aria-labelledby="tf-title tf-desc">
  <title id="tf-title">One telemetry frame on the wire</title>
  <desc id="tf-desc">A snapshot function builds one JSON frame. Sequence increases each second. The panel stores the latest frame and a short history ring.</desc>
  <rect width="680" height="460" fill="#F7F2E8"/>
  <text x="40" y="36" fill="#111111" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16" font-weight="500">Telemetry frame = one JSON message</text>
  <text x="40" y="56" fill="#5F5E5A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">In this lab the builder is named snapshot(sequence). It is not a Rive Snapshot.</text>
  <line x1="40" y1="120" x2="640" y2="120" stroke="#B4B2A9" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
  <text x="40" y="100" fill="#5F5E5A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">ws://.../stream - one frame per tick</text>
  <g>
    <rect x="70" y="96" width="88" height="48" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="114" y="118" text-anchor="middle" fill="#444441" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">seq 0</text>
    <text x="114" y="134" text-anchor="middle" fill="#5F5E5A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">past</text>
  </g>
  <g>
    <rect x="200" y="96" width="88" height="48" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="244" y="118" text-anchor="middle" fill="#444441" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">seq 1</text>
    <text x="244" y="134" text-anchor="middle" fill="#5F5E5A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">past</text>
  </g>
  <g>
    <rect x="330" y="96" width="88" height="48" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="374" y="118" text-anchor="middle" fill="#444441" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">seq 2</text>
    <text x="374" y="134" text-anchor="middle" fill="#5F5E5A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">past</text>
  </g>
  <g>
    <rect x="460" y="88" width="120" height="64" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
    <text x="520" y="116" text-anchor="middle" fill="#085041" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="500">seq N now</text>
    <text x="520" y="136" text-anchor="middle" fill="#0F6E56" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">latest frame</text>
  </g>
  <rect x="40" y="180" width="360" height="220" rx="4" fill="#111111"/>
  <text x="56" y="206" fill="#3ecfbf" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">{</text>
  <text x="72" y="228" fill="#F7F2E8" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">"deviceId": "lab-01",</text>
  <text x="72" y="248" fill="#F7F2E8" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">"online": true,</text>
  <text x="72" y="268" fill="#F7F2E8" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">"readings": {</text>
  <text x="88" y="288" fill="#e36a2c" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">"temperatureC": 22.1,</text>
  <text x="88" y="308" fill="#3ecfbf" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">"humidityPct": 47.2</text>
  <text x="72" y="328" fill="#F7F2E8" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">},</text>
  <text x="72" y="348" fill="#FAC775" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">"sequence": 12,</text>
  <text x="72" y="368" fill="#F7F2E8" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">"timestamp": 1731000000</text>
  <text x="56" y="388" fill="#3ecfbf" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">}</text>
  <g>
    <rect x="420" y="180" width="220" height="64" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="530" y="208" text-anchor="middle" fill="#712B13" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="500">temperatureC</text>
    <text x="530" y="228" text-anchor="middle" fill="#993C1D" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">-&gt; RIS radius / ribbon Y</text>
  </g>
  <g>
    <rect x="420" y="258" width="220" height="64" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="530" y="286" text-anchor="middle" fill="#085041" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="500">humidityPct</text>
    <text x="530" y="306" text-anchor="middle" fill="#0F6E56" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">-&gt; RIS ring opacity</text>
  </g>
  <g>
    <rect x="420" y="336" width="220" height="64" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="530" y="364" text-anchor="middle" fill="#633806" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="500">sequence</text>
    <text x="530" y="384" text-anchor="middle" fill="#854F0B" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">-&gt; ripple / frame order</text>
  </g>
  <text x="40" y="440" fill="#5F5E5A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">History ring = last ~48 readings. Continuum draws that ring as one smooth stroke (past -&gt; now).</text>
</svg>

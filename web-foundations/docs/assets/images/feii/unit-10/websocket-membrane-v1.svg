<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 420" role="img" aria-labelledby="ws-title ws-desc">
  <title id="ws-title">WebSocket as an operational membrane</title>
  <desc id="ws-desc">Device and panel stay connected through an open socket. Frames travel both ways. Connection states are live, reconnecting, and closed.</desc>
  <rect width="680" height="420" fill="#F7F2E8"/>
  <text x="40" y="36" fill="#111111" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16" font-weight="500">WebSocket - one open channel, many frames</text>
  <text x="40" y="56" fill="#5F5E5A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">Same React model as REST. Different transport shape: stateful, bidirectional, closable.</text>
  <g>
    <rect x="40" y="100" width="170" height="120" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
    <text x="125" y="145" text-anchor="middle" fill="#085041" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="500">Device / service</text>
    <text x="125" y="168" text-anchor="middle" fill="#0F6E56" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">lab-01 | FastAPI</text>
    <text x="125" y="190" text-anchor="middle" fill="#0F6E56" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">or MSW mock</text>
  </g>
  <g>
    <rect x="255" y="88" width="170" height="144" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
    <text x="340" y="118" text-anchor="middle" fill="#712B13" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="500">Membrane</text>
    <text x="340" y="140" text-anchor="middle" fill="#993C1D" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">WebSocket open</text>
    <text x="340" y="162" text-anchor="middle" fill="#993C1D" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">frames both ways</text>
    <text x="340" y="184" text-anchor="middle" fill="#993C1D" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">must close cleanly</text>
    <text x="340" y="206" text-anchor="middle" fill="#993C1D" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">reconnect if dropped</text>
  </g>
  <g>
    <rect x="470" y="100" width="170" height="120" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="555" y="145" text-anchor="middle" fill="#0C447C" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="500">Control panel</text>
    <text x="555" y="168" text-anchor="middle" fill="#185FA5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">React state / hooks</text>
    <text x="555" y="190" text-anchor="middle" fill="#185FA5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">SVG membrane UI</text>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="210" y1="145" x2="255" y2="145" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <line x1="255" y1="170" x2="210" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <line x1="425" y1="145" x2="470" y2="145" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <line x1="470" y1="170" x2="425" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <text x="232" y="136" text-anchor="middle" fill="#5F5E5A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">frames</text>
  <text x="232" y="188" text-anchor="middle" fill="#5F5E5A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">commands</text>
  <text x="447" y="136" text-anchor="middle" fill="#5F5E5A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">onmessage</text>
  <text x="447" y="188" text-anchor="middle" fill="#5F5E5A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10">send</text>
  <text x="40" y="270" fill="#111111" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="500">Connection states the panel must show</text>
  <g>
    <rect x="40" y="290" width="180" height="56" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text x="130" y="316" text-anchor="middle" fill="#27500A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="500">live</text>
    <text x="130" y="334" text-anchor="middle" fill="#3B6D11" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">frames arriving</text>
  </g>
  <g>
    <rect x="250" y="290" width="180" height="56" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="340" y="316" text-anchor="middle" fill="#633806" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="500">reconnecting</text>
    <text x="340" y="334" text-anchor="middle" fill="#854F0B" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">channel dropped</text>
  </g>
  <g>
    <rect x="460" y="290" width="180" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="550" y="316" text-anchor="middle" fill="#2C2C2A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="500">closed / idle</text>
    <text x="550" y="334" text-anchor="middle" fill="#5F5E5A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">cleanup done</text>
  </g>
  <text x="40" y="392" fill="#5F5E5A" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">REST = request/response per call. WebSocket = keep the channel; own open, drop, close.</text>
</svg>

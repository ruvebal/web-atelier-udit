{% assign outcome_cover_key = page.slug | default: page.title | slugify %}
{% assign outcome_cover = site.data.lesson_covers[outcome_cover_key] %}
{% if outcome_cover and outcome_cover.outcome %}
<figure class="lesson-outcome lesson-outcome--{{ outcome_cover.family }}" data-outcome-grammar="{{ outcome_cover.outcome.grammar }}" markdown="0">
<img src="{{ '/assets/images/lesson-covers/' | append: outcome_cover.outcome.asset | append: '.svg' | relative_url }}" width="1600" height="720" alt="{{ outcome_cover.outcome.alt_en | default: outcome_cover.master_idea | escape }}" />
</figure>
{% endif %}
